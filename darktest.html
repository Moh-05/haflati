<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Samsung dark mode test 4</title>
<style>
  body{background:#171215;color:#F5ECEF;font-family:system-ui,sans-serif;margin:0;padding:20px}
  .row{margin-bottom:16px;padding:14px;border:1px solid #43323A;border-radius:10px}
  .lbl{font-size:12px;color:#BCA3AA;margin-bottom:10px;font-family:monospace}
  .head{font-size:27px;font-weight:800;line-height:1.35}
  p.note{color:#BCA3AA;font-size:13px;line-height:1.5}

  /* A: current gradient */
  .a{background:linear-gradient(100deg,#F0BFCB,#D97C93 45%,#B59ACB);
     -webkit-background-clip:text;background-clip:text;color:transparent}

  /* B: gradient made of an SVG image instead of a colour gradient.
        Samsung does not repaint images. */
  .b{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='40'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='%23F0BFCB'/><stop offset='.45' stop-color='%23D97C93'/><stop offset='1' stop-color='%23B59ACB'/></linearGradient></defs><rect width='300' height='40' fill='url(%23g)'/></svg>");
     background-size:cover;-webkit-background-clip:text;background-clip:text;color:transparent}

  /* C: gradient + solid fallback underneath */
  .c{color:#D97C93;background:linear-gradient(100deg,#F0BFCB,#D97C93 45%,#B59ACB);
     -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
</style>
</head>
<body>
<h2 style="font-size:18px;margin:0 0 4px">Round 4 — headline only</h2>
<p class="note" style="margin-bottom:20px">Forced dark <b>ON</b>. Which looks closest to pink/mauve?</p>

<div class="row"><div class="lbl">A — current</div><div class="head a">بحجز تثق فيه</div></div>
<div class="row"><div class="lbl">B — SVG gradient image</div><div class="head b">بحجز تثق فيه</div></div>
<div class="row"><div class="lbl">C — gradient + fallback</div><div class="head c">بحجز تثق فيه</div></div>

<p class="note" style="margin-top:20px">Tell me: A, B or C looks best?</p>
</body>
</html>
